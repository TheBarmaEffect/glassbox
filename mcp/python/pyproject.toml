[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "glassbox-framework"
version = "1.0.1"
description = "Glass Box Framework — runtime constitutional verification for AI answers. Every claim carries a reasoning chain. Every score breaks down. Every verdict is traceable."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Karthik Barma", email = "golla.sat@northeastern.edu" }
]
keywords = ["mcp", "model-context-protocol", "ai-safety", "constitutional-ai", "verification", "glass-box", "trust-card"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.8"]

[project.urls]
Homepage = "https://github.com/TheBarmaEffect/glassbox"
Repository = "https://github.com/TheBarmaEffect/glassbox"
Issues = "https://github.com/TheBarmaEffect/glassbox/issues"

[project.scripts]
glassbox = "glassbox_framework.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["glassbox_framework"]
