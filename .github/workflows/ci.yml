  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platforms/ide/vscode-glassbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platforms/ide/vscode-glassbox/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run package
      # npm's advisory endpoint is a network dependency and has returned 503, 400 and
      # timeouts during a single afternoon. An unreachable advisory service is not
      # evidence of a vulnerability, and blocking deploys on npm's uptime is wrong — but
      # a real finding must still fail. So: retry endpoint errors, fail on anything else.
      # Ambiguous output fails, not passes.
      - name: Audit production dependencies
        run: |
          for attempt in 1 2 3; do
            # Each attempt is capped: a failing advisory endpoint can hang for five or six
            # minutes before npm gives up, which turned a retry loop into a twenty-minute
            # job. Exit 124 is the cap firing and is treated as a transport error.
            # `timeout` is coreutils and present on the runners, but guard anyway: a
            # missing binary would otherwise exit 127 and be misread as a real finding.
            cap=""
            command -v timeout >/dev/null 2>&1 && cap="timeout 90"
            set +e
            out=$($cap npm audit --omit=dev --audit-level=high 2>&1)
            code=$?
            set -e
