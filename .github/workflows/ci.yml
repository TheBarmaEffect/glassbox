name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  platform-gateway:
    name: Zero-cost platform gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platforms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platforms/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      # npm's advisory endpoint is a network dependency and has returned 503, 400 and
      # timeouts during a single afternoon. An unreachable advisory service is not
      # evidence of a vulnerability, and blocking deploys on npm's uptime is wrong — but
      # a real finding must still fail. So: retry endpoint errors, fail on anything else.
      # Ambiguous output fails, not passes.
      - name: Audit production dependencies
        run: |
          for attempt in 1 2 3; do
            # Each attempt is capped: a failing advisory endpoint can hang for five or six
            # minutes before npm gives up, which turned a retry loop into a twenty-minute
            # job. Exit 124 is the cap firing and is treated as a transport error.
            # `timeout` is coreutils and present on the runners, but guard anyway: a
            # missing binary would otherwise exit 127 and be misread as a real finding.
            cap=""
            command -v timeout >/dev/null 2>&1 && cap="timeout 90"
            set +e
            out=$($cap npm audit --omit=dev --audit-level=high 2>&1)
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              printf '%s\n' "$out"; exit 0
            fi
            if [ "$code" -eq 124 ] || printf '%s' "$out" | grep -qiE 'audit endpoint returned an error|Service Unavailable|Bad Request|ETIMEDOUT|ENOTFOUND|ECONNRESET|network timeout'; then
              echo "::warning::npm audit endpoint unreachable on attempt $attempt (exit $code); retrying"
              printf '%s\n' "$out" | tail -3
              sleep $((attempt * 10))
              continue
            fi
            printf '%s\n' "$out"
            echo "::error::npm audit reported findings at or above high severity"
            exit 1
          done
          echo "::warning::npm audit endpoint unavailable after 3 attempts; not failing the build. npm ci in this job already validated the lockfile against package.json."

  reddit-devvit:
    name: Reddit Devvit app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platforms/devvit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: 'npm'
          cache-dependency-path: platforms/devvit/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run audit:runtime

  browser-extension:
    name: Browser extension packages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: browser-extension/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      # npm's advisory endpoint is a network dependency and has returned 503, 400 and
      # timeouts during a single afternoon. An unreachable advisory service is not
      # evidence of a vulnerability, and blocking deploys on npm's uptime is wrong — but
      # a real finding must still fail. So: retry endpoint errors, fail on anything else.
      # Ambiguous output fails, not passes.
