name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default. Only the jobs that publish artifacts need more, and none of them
# needs write access to the repository.
permissions:
  contents: read

# Superseded pull-request runs are cancelled; runs on the tracked branch are not, because
# auto-deploy is gated on this workflow and a cancelled run is not a passed one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  platform-gateway:
    name: Zero-cost platform gateway
    runs-on: ubuntu-latest
    # Every job carries a timeout. Without one the default is six hours, and a hung test
    # or a stalled registry call holds a runner for the rest of the day rather than
    # failing. The value is generous relative to the observed runtime, so it fires on a
    # hang rather than on a slow day.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platforms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Read from .nvmrc rather than hardcoded here, so CI cannot disagree with what
          # `nvm use` gives a developer. A test cancelled on Node 20 and passing on Node
          # 26 was unreproducible locally for hours; the version now lives in one file.
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: platforms/package-lock.json

      - name: Node version alignment (.nvmrc, Dockerfile, engines)
        run: node scripts/node-version-check.mjs

      # npm ci, not npm install: it installs strictly from the lockfile and fails if the
      # lockfile and package.json disagree. A local `npm audit fix` once left an
      # incoherent lockfile that the registry rejected, and only npm ci catches that.
      - run: npm ci --no-audit --no-fund

      - name: Self-test the CI guards before trusting them
        run: |
          node scripts/check-test-summary.mjs --selftest
          node scripts/audit-gate.mjs --selftest

      # The single most important step in this file.
      #
      # node:test reports a test that could not complete as *cancelled*, not *failed*. On
      # CI's Node 20 an unref'd deadline timer racing a bare promise drained the event loop
      # and produced `fail 0, cancelled 3`. The summary line said `fail 0`, so the red
      # build read as infrastructure noise and the real cause was hunted for hours. The
      # guard fails on cancelled > 0, on a missing summary, on a suspiciously small pass
      # count, and on the runner disagreeing with its own summary.
      - name: Test
        run: |
          set +e
          npm test 2>&1 | tee platform-tests.log
          runner_exit=${PIPESTATUS[0]}
          set -e
          node scripts/check-test-summary.mjs platform-tests.log \
            --min-pass=100 --runner-exit="$runner_exit"

      - run: npm run typecheck
      - run: npm run build

      # An unreachable advisory endpoint is not evidence of a vulnerability, and blocking a
      # deploy on npm's uptime is wrong; a real finding must still stop the deploy. The
      # gate decides from parsed `npm audit --json` counts rather than by grepping prose,
      # retries transport failures, and lives in one file instead of five copies.
      - name: Audit production dependencies
        run: node scripts/audit-gate.mjs

  docker-image:
    name: Gateway Docker image builds and boots
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The image is what actually gets deployed, and until now nothing built it.
      #
      # The gap was concrete: tsconfig.json includes test/**/*.ts, while .dockerignore
      # excludes test, so `tsc` inside the image compiles a different file set than `tsc`
      # in the repository. Anything that made the build depend on the test tree would pass
      # CI and break at deploy time. Same Dockerfile, same context, same .dockerignore as
      # Render's blueprint (rootDir: platforms, dockerContext: .).
      - name: Build the image the way Render builds it
        run: docker build --file platforms/Dockerfile --tag glassbox-gateway:ci platforms

      - name: The compiled image must not contain the test tree
        run: |
          # Not a style preference: if test files ever reach the image, the image is no
          # longer the artefact CI validated, and .dockerignore has silently stopped
          # applying.
          if docker run --rm --entrypoint sh glassbox-gateway:ci -c 'ls dist/test 2>/dev/null'; then
            echo "::error::dist/test exists in the runtime image; .dockerignore is not excluding test/"
            exit 1
          fi
          docker run --rm --entrypoint sh glassbox-gateway:ci -c 'test -f dist/src/index.js' \
            || { echo "::error::dist/src/index.js is missing from the image the CMD runs"; exit 1; }
          echo "image contains the entrypoint and no compiled tests"

      - name: Boot the image
        run: |
          # Generated here, used only by this container, masked so it cannot reach the log.
          # It exists because the api adapter is only enabled when a shared secret is set,
          # and the boot check below asserts that adapter is wired into the built image.
          secret=$(openssl rand -hex 24)
          echo "::add-mask::$secret"
          echo "PLATFORM_SHARED_SECRET=$secret" >> "$GITHUB_ENV"
          docker run -d --name gateway -p 8080:8080 \
            -e PORT=8080 \
            -e GLASSBOX_BACKEND=lite \
            -e PLATFORM_MAX_CONCURRENCY=1 \
            -e PLATFORM_ALLOW_PUBLIC=false \
            -e PLATFORM_PUBLIC_PLATFORMS=mcp \
            -e PLATFORM_RATE_LIMIT=120 \
            -e PLATFORM_SHARED_SECRET="$secret" \
            glassbox-gateway:ci
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:8080/ready >/dev/null 2>&1; then
              echo "the image answered /ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the built image never became ready on :8080"
          docker logs gateway || true
          exit 1

      # The same script the scheduled live workflow runs against production, pointed at the
      # container. Against production it cannot gate a deploy, because a sleeping free-tier
      # instance is not a code defect. Against a container this workflow just built, there
      # is no such excuse, so here it does gate — including the authenticated release gate,
      # which the production run has to skip for want of a secret.
      - name: Live end-to-end suite against the built image
        run: node platforms/scripts/live-e2e.mjs --base=http://127.0.0.1:8080 --no-color

      - name: Container logs
        if: always()
        run: docker logs gateway || true

      - name: Stop the container
        if: always()
        run: docker rm -f gateway || true

  lockfile-integrity:
    name: Every lockfile installs from scratch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # A local `npm audit fix` left a lockfile that resolved locally and was rejected by
      # the registry, and the job that would have caught it used `npm install` — which
      # rewrites the lockfile instead of validating it.
      #
      # Projects are discovered rather than listed, so a new one is covered the day it is
      # added rather than the day someone remembers to add a job for it. --ignore-scripts
      # keeps this to the question being asked: does the lockfile resolve and install. The
      # per-project jobs run the real installs.
      - name: npm ci in every Node project
        run: |
          set -o pipefail
          failed=0
          checked=0
          while IFS= read -r lockfile; do
            dir=$(dirname "$lockfile")
            checked=$((checked + 1))
            printf '\n===== %s =====\n' "$dir"
            if ( cd "$dir" && npm ci --ignore-scripts --no-audit --no-fund >/dev/null ); then
              echo "ok"
            else
              echo "::error::npm ci failed in ${dir}: the lockfile is incoherent with its package.json"
              failed=$((failed + 1))
            fi
          done < <(find . -name package-lock.json -not -path '*/node_modules/*' | sort)
          echo ""
          if [ "$checked" -eq 0 ]; then
            echo "::error::no package-lock.json was found; this check would pass vacuously"
            exit 1
          fi
          echo "checked ${checked} project(s), ${failed} incoherent"
          [ "$failed" -eq 0 ]

  reddit-devvit:
    name: Reddit Devvit app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platforms/devvit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Devvit needs a newer Node than the gateway, so this one is pinned here rather
          # than read from .nvmrc. node-version-check.mjs reports every project's declared
          # range so the difference is visible instead of accidental.
          node-version: '22.20.0'
          cache: 'npm'
          cache-dependency-path: platforms/devvit/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Types, lint, test, build and config validation
        run: |
          set +e
          npm run check 2>&1 | tee devvit-check.log
          runner_exit=${PIPESTATUS[0]}
          set -e
          # `npm run check` runs node:test, so the cancelled-test class applies here too.
          node "$GITHUB_WORKSPACE/platforms/scripts/check-test-summary.mjs" \
            devvit-check.log --min-pass=1 --runner-exit="$runner_exit"
      # This job used to call `npm run audit:runtime`, a bare `npm audit` with no retry, so
      # it kept every npm-downtime failure mode the other jobs had just been hardened
      # against. One implementation, used everywhere.
      - name: Audit production dependencies
        run: node "$GITHUB_WORKSPACE/platforms/scripts/audit-gate.mjs"

  browser-extension:
    name: Browser extension packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: browser-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: browser-extension/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Test and build
        run: |
          set +e
          npm run check 2>&1 | tee extension-check.log
          runner_exit=${PIPESTATUS[0]}
          set -e
          # `npm run check` runs node --test before building, so the cancelled-test class
          # applies here too. min-pass is 1 rather than a real floor because this suite is
          # small; the point is to catch cancellations and a glob that matched nothing.
          node "$GITHUB_WORKSPACE/platforms/scripts/check-test-summary.mjs" \
            extension-check.log --min-pass=1 --runner-exit="$runner_exit"
      - name: Audit production dependencies
        run: node "$GITHUB_WORKSPACE/platforms/scripts/audit-gate.mjs"
      - run: unzip -t dist/glassbox-lite-chromium-0.1.0.zip
      - run: unzip -t dist/glassbox-lite-firefox-0.1.0.xpi
      - uses: actions/upload-artifact@v4
        with:
          name: glassbox-browser-extensions
          path: |
            browser-extension/dist/glassbox-lite-chromium-0.1.0.zip
            browser-extension/dist/glassbox-lite-firefox-0.1.0.xpi
            browser-extension/dist/SHA256SUMS

  notion-integration:
    name: Notion connection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: notion-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # This project declares engines.node >=22 and is pinned accordingly.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: notion-integration/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck, test and build
        run: |
          set +e
          npm run check 2>&1 | tee notion-check.log
          runner_exit=${PIPESTATUS[0]}
          set -e
          node "$GITHUB_WORKSPACE/platforms/scripts/check-test-summary.mjs" \
            notion-check.log --min-pass=1 --runner-exit="$runner_exit"
      - name: Audit production dependencies
        run: node "$GITHUB_WORKSPACE/platforms/scripts/audit-gate.mjs"

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platforms/ide/vscode-glassbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: platforms/ide/vscode-glassbox/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Test and package
        run: |
          set +e
          npm run package 2>&1 | tee vsce-package.log
          runner_exit=${PIPESTATUS[0]}
          set -e
          node "$GITHUB_WORKSPACE/platforms/scripts/check-test-summary.mjs" \
            vsce-package.log --min-pass=1 --runner-exit="$runner_exit"
      - name: Audit production dependencies
        run: node "$GITHUB_WORKSPACE/platforms/scripts/audit-gate.mjs"
      - run: unzip -t dist/glassbox-lite-0.1.0.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: glassbox-vscode-extension
          path: platforms/ide/vscode-glassbox/dist/glassbox-lite-0.1.0.vsix

  jetbrains-plugin:
    name: JetBrains plugin
    runs-on: ubuntu-latest
    # Gradle resolves a plugin-verifier IDE distribution, which is the slowest step in this
    # workflow, so this timeout is the loosest.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: platforms/ide/jetbrains-glassbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon test verifyPluginStructure buildPlugin verifyPlugin
      - run: unzip -t build/distributions/glassbox-lite-0.1.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: glassbox-jetbrains-plugin
          path: platforms/ide/jetbrains-glassbox/build/distributions/glassbox-lite-0.1.0.zip

  typescript:
    name: TypeScript strict-mode + MCP smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: mcp/package-lock.json
      # Was `npm install`, which rewrites the lockfile rather than validating it, so this
      # job could pass on a lockfile the registry would reject.
      - run: npm ci --no-audit --no-fund
      - name: Type-check (strict)
        run: NODE_OPTIONS='--max-old-space-size=4096' npx tsc --noEmit
      - name: Smoke test (server boots, registers 6 tools)
        run: |
          set -o pipefail
          node demo/launch-demo.mjs --fast 2>&1 | tee /tmp/smoke.log
          grep -q "Demo complete" /tmp/smoke.log
          grep -q "glassbox-85cc09903bd4b3f8022a4087" /tmp/smoke.log
          echo "✓ canonical audit log_id reproduced"

  python:
    name: Python package builds + installs + imports
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One Python version failing should not hide the state of the others.
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: mcp/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install in a fresh venv
        run: |
          python -m venv /tmp/test-venv
          /tmp/test-venv/bin/pip install dist/glassbox_framework-*.whl
      - name: Verify import + version + exports
        run: |
          /tmp/test-venv/bin/python -c "
          from glassbox_framework import Glassbox, GlassboxError, ToolError
          import glassbox_framework
          assert glassbox_framework.__version__, 'no version'
          assert Glassbox.__name__ == 'Glassbox'
          assert GlassboxError.__name__ == 'GlassboxError'
          assert ToolError.__name__ == 'ToolError'
          print('✓ import contract verified')
          "

  determinism:
    name: Cross-language audit-hash determinism
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [typescript]
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: mcp/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Run JS demo, capture log_id
        run: |
          set -o pipefail
          node demo/launch-demo.mjs --fast 2>&1 | grep "log_id:" | head -1 \
            | awk '{print $NF}' > /tmp/js-log-id.txt
          cat /tmp/js-log-id.txt
      - name: Build Python package + run via installed client
        run: |
          cd python
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m venv /tmp/det-venv
          /tmp/det-venv/bin/pip install dist/glassbox_framework-*.whl
          export GLASSBOX_SERVER_CMD="npx ts-node ${{ github.workspace }}/mcp/src/index.ts"
          /tmp/det-venv/bin/python -c "
          import json
          from glassbox_framework import Glassbox
          with open('${{ github.workspace }}/mcp/demo/raw-inputs.json') as f: i=json.load(f)
          with Glassbox() as gb:
              c=gb.generate_trust_card(question=i['question'],answer=i['answer'],claims=i['claims'],red_team=i['red_team'],ecs=i['ecs'],constitution=i['constitution'],intents=i['intents'])
          print(c['audit']['log_id'])
          " > /tmp/py-log-id.txt
          cat /tmp/py-log-id.txt
      - name: Assert byte-identical log_id from JS and Python
        run: |
          # Both must equal the canonical reference
          JS_ID=$(cat /tmp/js-log-id.txt | sed 's/\x1b\[[0-9;]*m//g' | tr -d '[:space:]')
          PY_ID=$(cat /tmp/py-log-id.txt | tr -d '[:space:]')
          echo "JS:  $JS_ID"
          echo "PY:  $PY_ID"
          echo "REF: glassbox-85cc09903bd4b3f8022a4087"
          test -n "$JS_ID"
          test "$JS_ID" = "$PY_ID"
          test "$JS_ID" = "glassbox-85cc09903bd4b3f8022a4087"
          echo "✓ deterministic across language boundary"
